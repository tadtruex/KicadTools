[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicadtools"
version = "0.1.0"
description = "Read and analyze KiCad schematics (.kicad_sch)"
authors = [{ name = "Tad Truex" }]
requires-python = ">=3.10"
dependencies = ["sexpdata>=1.0", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["PySide6>=6.6"]
# The parts database on a MariaDB server (DB_PLAN.md).
server = ["PyMySQL>=1.1"]
# The lab inventory: reading the master component list (.numbers) for the
# import (INVENTORY_PLAN.md step 2; a CSV export needs nothing extra) and
# typo-tolerant search (step 3), and item pictures (pillow).
inventory = ["numbers-parser>=4.10", "rapidfuzz>=3.0", "pillow>=10"]
# The lab inventory web app (INVENTORY_PLAN.md step 4). httpx is only for
# its tests (FastAPI's TestClient).
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9",
       "rapidfuzz>=3.0", "pillow>=10", "httpx>=0.27"]

[project.scripts]
kicadtools = "kicadtools.cli:main"
kicadtools-cockpit = "kicadtools.gui.app:main"
kicadtools-web = "kicadtools.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kicadtools.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
