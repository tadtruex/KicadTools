[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicadtools"
version = "0.1.0"
description = "Read and analyze KiCad schematics (.kicad_sch)"
authors = [{ name = "Tad Truex" }]
requires-python = ">=3.10"
dependencies = ["sexpdata>=1.0", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["PySide6>=6.6"]
# The parts database on a MariaDB server (DB_PLAN.md).
server = ["PyMySQL>=1.1"]
# Reading the master component list (.numbers) for the inventory import
# (INVENTORY_PLAN.md step 2); a CSV export needs nothing extra.
inventory = ["numbers-parser>=4.10"]

[project.scripts]
kicadtools = "kicadtools.cli:main"
kicadtools-cockpit = "kicadtools.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
