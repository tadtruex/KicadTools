{% extends "base.html" %}
{% block main %}
<h1>Not found</h1>
<p>There is no {{ what }}.</p>
{% if make_bin %}
<form method="post" action="/bins" class="inline">
  <input type="hidden" name="name" value="{{ make_bin.split('/')[-1] }}">
  {% if '/' in make_bin %}<input type="hidden" name="parent" value="{{ make_bin.rsplit('/', 1)[0] }}">{% endif %}
  <button type="submit">Make bin {{ make_bin }}</button>
</form>
{% endif %}
<p><a href="/">Search</a></p>
{% endblock %}
