<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lab inventory{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/pictures.js" defer></script>
</head>
<body>
<header>
  <nav>
    <a href="/" class="brand">Inventory</a>
    <a href="/add">Add</a>
    <a href="/locations">Locations</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer><span class="muted small">Lab inventory · {{ version }}</span></footer>
{% if choices %}
<datalist id="dl-category">{% for v in choices.category %}<option value="{{ v }}">{% endfor %}</datalist>
<datalist id="dl-manufacturer">{% for v in choices.manufacturer %}<option value="{{ v }}">{% endfor %}</datalist>
<datalist id="dl-tag">{% for v in choices.tag %}<option value="{{ v }}">{% endfor %}</datalist>
<datalist id="dl-location">{% for v in choices.location %}<option value="{{ v }}">{% endfor %}</datalist>
{% endif %}
</body>
</html>
